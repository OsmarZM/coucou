[package]
name = "coucou-hook"
description = "Relays privacy-safe CLI agent events over a Windows named pipe or Linux Unix socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coucou-hook"
path = "src/main.rs"

[dependencies]
coucou-agent-protocol = { path = "../agent-protocol" }
serde_json = "1"

# Just enough Win32 to know our own SID and to check who is serving the pipe.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# The socket syscalls and peer credentials the Linux transport needs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
