[package]
name = "coucou"
description = "Coucou for Windows and Linux — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coucou-agent-protocol = { path = "../agent-protocol" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "process", "fs"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
lopdf = { version = "=0.45.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "=0.42.0"
sha2 = "0.10.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
